[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/c9s/bbgo"

[workspace.dependencies]
bbgo-fixedpoint = { path = "crates/bbgo-fixedpoint" }
bbgo-util = { path = "crates/bbgo-util" }
bbgo-types = { path = "crates/bbgo-types" }
bbgo-core = { path = "crates/bbgo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
