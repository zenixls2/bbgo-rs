version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${BBGO_SWARM_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: bbgo_backtest_test
    ports:
      - target: 3306
        published: ${BBGO_SWARM_MYSQL_PORT}
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints: ["node.id == ${BBGO_SWARM_NODE}"]
      restart_policy:
        condition: on-failure
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${BBGO_SWARM_PASSWORD}"
      POSTGRES_DB: bbgo_backtest_test
    ports:
      - target: 5432
        published: ${BBGO_SWARM_POSTGRES_PORT}
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bbgo_backtest_test"]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints: ["node.id == ${BBGO_SWARM_NODE}"]
      restart_policy:
        condition: on-failure
volumes:
  mysql-data:
  postgres-data:
