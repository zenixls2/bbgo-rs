name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: bash -n scripts/test-sql-swarm.sh
      - run: python3 scripts/test_sql_swarm_script.py
      - run: python3 scripts/test_sql_local_script.py
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  sql-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo sql-swarm-init --advertise-addr 127.0.0.1
      - run: cargo test-sql-swarm
